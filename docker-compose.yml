services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lis}
      POSTGRES_USER: ${POSTGRES_USER:-lis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lis_dev_password}
    volumes:
      - lis_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lis}:${POSTGRES_PASSWORD:-lis_dev_password}@db:5432/${POSTGRES_DB:-lis}
      PORT: 4044
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      HOSPITAL_NAME: ${HOSPITAL_NAME:-Akash Diagnostic Center}
      HOSPITAL_ADDRESS: ${HOSPITAL_ADDRESS:-Bhiwani Chungi, Bhiwani Road, Rohtak 124001, Haryana}
      HOSPITAL_PHONE: ${HOSPITAL_PHONE:-7206620626}
      HOSPITAL_PATIENT_API_URL: ${HOSPITAL_PATIENT_API_URL:-}
      HOSPITAL_PATIENT_API_TOKEN: ${HOSPITAL_PATIENT_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4044:4044"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4044/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  lis_postgres_data:
