x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  db:
    logging: *bounded-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lis}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lis_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 60s
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    logging: *bounded-logging
    image: akash-lis-backend:${LIS_VERSION:-1.1.0}
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 4044
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-5000}
      JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
      HOSPITAL_NAME: ${HOSPITAL_NAME:-Akash Diagnostic Center}
      HOSPITAL_ADDRESS: ${HOSPITAL_ADDRESS:-Bhiwani Chungi, Bhiwani Road, Rohtak 124001, Haryana}
      HOSPITAL_PHONE: ${HOSPITAL_PHONE:-7206620626}
      HOSPITAL_PATIENT_API_URL: ${HOSPITAL_PATIENT_API_URL:-}
      HOSPITAL_PATIENT_API_TOKEN: ${HOSPITAL_PATIENT_API_TOKEN:-}
      HOSPITAL_PATIENT_PROVIDER: ${HOSPITAL_PATIENT_PROVIDER:-api}
      HMS_SQL_SERVER: ${HMS_SQL_SERVER:-}
      HMS_SQL_PORT: ${HMS_SQL_PORT:-1433}
      HMS_SQL_REQUEST_TIMEOUT_MS: ${HMS_SQL_REQUEST_TIMEOUT_MS:-30000}
      HMS_SQL_DATABASE: ${HMS_SQL_DATABASE:-}
      HMS_SQL_USER: ${HMS_SQL_USER:-}
      HMS_SQL_PASSWORD: ${HMS_SQL_PASSWORD:-}
      HMS_SQL_PATIENT_VIEW: ${HMS_SQL_PATIENT_VIEW:-dbo.LisPatientLookup}
      HMS_SQL_ENCRYPT: ${HMS_SQL_ENCRYPT:-true}
      HMS_SQL_TRUST_SERVER_CERTIFICATE: ${HMS_SQL_TRUST_SERVER_CERTIFICATE:-false}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4044"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4044/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    logging: *bounded-logging
    image: akash-lis-frontend:${LIS_VERSION:-1.1.0}
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  backup:
    # Reuses the db image; runs pg_dump, not a second PostgreSQL server.
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/lis/backup.sh"]
    command: ["schedule"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-lis}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGCONNECT_TIMEOUT: 15
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-30}
    volumes:
      - type: bind
        source: ${LIS_BACKUP_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: false
      - ./docker/backup.sh:/opt/lis/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/lis/backup.sh", "health"]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 5m
    logging: *bounded-logging

volumes:
  lis_postgres_data:
